set-environment -gu GIT_EDITOR

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:usstyle:strikethrough:focus"
set -g focus-events on
set -s escape-time 10
set -s copy-command "pbcopy"
set -g history-limit 50000
set -g mouse on
set -g set-titles on
set -g set-titles-string "#S: #W"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
setw -g automatic-rename-format "#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}"

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

%hidden is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"
bind -n -N "Select pane left (vim-aware)" C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n -N "Select pane down (vim-aware)" C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n -N "Select pane up (vim-aware)" C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n -N "Select pane right (vim-aware)" C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind -N "Clear screen" C-l send-keys C-l

bind -N "Split below" '"' split-window -v -c "#{pane_current_path}"
bind -N "Split right" % split-window -h -c "#{pane_current_path}"
bind -N "Split below" - split-window -v -c "#{pane_current_path}"
bind -N "Split right" | split-window -h -c "#{pane_current_path}"
bind -N "New window" c new-window -c "#{pane_current_path}"
bind -r -N "Resize pane left" H resize-pane -L 5
bind -r -N "Resize pane down" J resize-pane -D 5
bind -r -N "Resize pane up" K resize-pane -U 5
bind -r -N "Resize pane right" L resize-pane -R 5
bind -N "Kill pane" x kill-pane
bind -N "Reload tmux.conf" r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

bind -N "Lazygit" G display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind -N "Toggle scratch session" t if-shell -F "#{==:#{session_name},scratch}" {
  detach-client
} {
  display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "tmux new-session -A -s scratch \\; set status off \\; set detach-on-destroy on"
}

set -g status-style "bg=#282a36,fg=#f8f8f2"
set -g status-left-length 30
set -g status-left "#{?client_prefix,#[bg=#ff79c6],#[bg=#bd93f9]}#[fg=#282a36,bold] #S #[default] "
set -g status-right "#[fg=#6272a4]#h #[fg=#8be9fd]%H:%M "
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#6272a4] #I #W "
setw -g window-status-current-format "#[bg=#44475a,fg=#f8f8f2,bold] #I #W#{?window_zoomed_flag, [Z],} "
setw -g window-status-activity-style "fg=#ffb86c"
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#bd93f9"
set -g message-style "bg=#44475a,fg=#f8f8f2"
set -g message-command-style "bg=#44475a,fg=#f8f8f2"
setw -g mode-style "bg=#44475a,fg=#f8f8f2"
set -g display-panes-colour "#6272a4"
set -g display-panes-active-colour "#bd93f9"
setw -g clock-mode-colour "#bd93f9"
set -g theme terminal

set -g @whichkey-auto on
if-shell "test -x ~/.config/tmux/plugins/whichkey-tmux/whichkey.tmux" "run-shell ~/.config/tmux/plugins/whichkey-tmux/whichkey.tmux"
