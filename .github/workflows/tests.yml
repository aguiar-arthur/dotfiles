name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quick:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Programs
        run: brew install neovim ripgrep fd tree-sitter-cli node stylua shfmt rumdl pandoc
      - name: TeX
        run: |
          brew install --cask basictex
          echo /Library/TeX/texbin >> "$GITHUB_PATH"
          export PATH="$PATH:/Library/TeX/texbin"
          command -v latexmk || {
            sudo tlmgr update --self
            sudo tlmgr install latexmk
          }
      - name: Link Neovim
        run: macos/nvim/link.sh
      - name: Plugins
        run: nvim --headless "+Lazy! restore" +qa
      - name: Servers, parsers and spell files
        run: nvim --headless "+lua require('dotfiles.install').run()"
      - name: Quick tests
        run: tests/nvim.sh
