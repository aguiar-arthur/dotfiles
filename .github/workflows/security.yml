name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ShellCheck
        run: |
          shellcheck -S warning -e SC1090 macos/install.sh macos/*/*.sh config/nvim/dashboard/clock.sh
          shellcheck -s bash -S warning macos/lib.sh
          shellcheck -s bash -S warning -e SC1090,SC2034 tests/*.sh
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: zizmor
        run: pipx run zizmor==1.32.0 .github/workflows
